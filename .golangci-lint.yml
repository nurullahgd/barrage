run:
  timeout: 5m

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - gosimple
    - ineffassign
    - unused
    - gocritic
    - misspell
    - gofmt
    - exhaustive
    - noctx

linters-settings:
  gocritic:
    enabled-tags:
      - diagnostic
      - performance
      - style
  errcheck:
    check-type-assertions: true
    check-blank: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck